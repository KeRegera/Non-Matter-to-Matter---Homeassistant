name: Matter Bridge
version: "1.1.2"
slug: matter_bridge
description: Stellt beliebige Home-Assistant-Geräte (auch Nicht-Matter-Geräte) als Matter-Geräte bereit
url: https://github.com/KeRegera/Non-Matter-to-Matter---Homeassistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Matter needs mDNS and IPv6 multicast on the local network
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 0
panel_icon: mdi:access-point-network
panel_title: Matter Bridge
options:
  log_level: info
  bridge_name: HA Matter Bridge
  port: 5540
  include_domains: []
  include_labels:
    - matter
  exclude_entities: []
  exclude_hidden: true
  matter_tcp: true
schema:
  log_level: list(debug|info|warning|error)
  bridge_name: str
  port: port
  passcode: int(1,99999998)?
  discriminator: int(0,4095)?
  network_interface: str?
  include_domains:
    - str
  include_labels:
    - str
  exclude_entities:
    - str
  exclude_hidden: bool
  matter_tcp: bool
